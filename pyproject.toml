[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-team-pairs-baseline"
version = "0.1.0"
description = "Configurable, auditable S&P 500 Engle-Granger pairs-trading research baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "statsmodels>=0.14.4,<0.16", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[project.scripts]
sp500-pairs = "sp500_pairs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sp500_pairs = ["defaults.toml"]
