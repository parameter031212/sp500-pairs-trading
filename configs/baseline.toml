# 팀 공통 기준 설정. 개인 실험은 example_experiment.toml을 복사하세요.
[data]
mode = "csv"
# 저장소 루트 기준 상대 경로. --data-dir 또는 SP500_DATA_DIR로 덮어쓸 수 있습니다.
directory = "data"
prices_file = "SP500_adjusted_close_cleaned_2005-09-27_2025-12-31.csv"
membership_file = "S&P 500 Historical Components & Changes (Updated).csv"
sectors_file = "SP500_sector_mapping.csv"
min_formation_coverage = 0.99
min_formation_observations = 120
# 데이터 파일이 static 섹터이면 결과에 역사적 분류가 아님을 표시합니다.
unknown_sectors = ["", "Unknown", "Other", "Unclassified", "미분류"]
excluded_tickers = []

[corporate_actions]
enabled = true
events_file = "reference_data/merger_events.csv"

[schedule]
start = "2016-01-01"
end = "2024-12-31"
formation_months = 12
trading_months = 6
# 재선정 주기는 trading_months와 같음: 거래 구간은 항상 비중첩.

[formation]
orientation = "fixed" # fixed 또는 best_of_two (방향 선택에 Bonferroni 보정)
cointegration_alpha = 0.05
autolag = "AIC" # AIC, BIC, fixed
maxlag = -1 # -1: statsmodels의 표본 길이 기반 기본값. fixed이면 0 이상 필요.
min_return_correlation = 0.5
correlation_filter = true
beta_min = 0.3
beta_max = 3.0
half_life_min = 5.0
half_life_max = 30.0
half_life_filter = true
# 개별 I(1) 진단은 항상 저장. 이미지에 없는 추가 하드필터는 기본 미사용.
require_i1 = false
i1_alpha = 0.05
# none: 페어별 명목 5%. holm/fdr_by: 전체 섹터 내 후보군에 대한 보정 실험.
multiple_testing = "none"

[selection]
max_pairs = 20
max_per_sector = 0 # 0: 섹터당 페어 수 제한 없음
max_per_stock = 0 # 0: 종목당 페어 수 제한 없음

[strategy]
entry_z = 2.0
# 양의 Z에서 진입한 숏 스프레드는 Z <= exit_z에서 청산 신호.
# 음의 Z에서 진입한 롱 스프레드는 Z >= -exit_z. 양수: 조기 청산, 음수: 평균 통과 후 청산.
exit_z = 0.0
stop_enabled = true
stop_z = 3.5
max_holding_enabled = true
max_holding_days = 60 # 체결일=1일. 60번째 거래일 종가에 사전 예약 청산.
reentry_after_stop = "block_window" # block_window 또는 after_reset
reentry_after_time_exit = "block_window"
# 당일 종가 신호 -> 다음 거래일 종가 체결. 이 시점 규칙은 공통으로 고정.

[portfolio]
initial_capital = 1000000.0
cash_annual_rate = 0.0
# 구간 시작 NAV / max_pairs. 빈 슬롯은 현금. 보유 중 수량 고정.

[costs]
commission_bps = 5.0 # 양쪽 레그의 실제 매매금액 각각에 부과
slippage_bps = 0.0 # 체결 마찰의 금액 비용으로 별도 차감
borrow_annual_bps = 0.0 # 전일 공매도 평가금액 * 달력일수 / 365

[evaluation]
active_split = "all" # all, train, validation, test
# 5번 기간 분리는 미정. 아래 날짜를 정하면 active_split으로 선택 가능.
train_start = ""
train_end = ""
validation_start = ""
validation_end = ""
test_start = ""
test_end = ""
annualization = 252
risk_free_annual_rate = 0.0

[run]
seed = 20260911
output_directory = "results"
max_windows = 0 # 0: 전체. 1 이상: 실행 점검용 일부 구간; 결과에 제한 실행 표시.
